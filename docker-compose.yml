name: docket

services:
  postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: docket
      POSTGRES_USER: docket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docket-smoke}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docket -d docket"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [docket-internal]

  docket:
    image: ${DOCKET_IMAGE:-docket-docket:latest}
    build:
      context: .
      args:
        DOCKET_BUILD_REVISION: ${DOCKET_BUILD_REVISION:-unknown}
    restart: unless-stopped
    user: "${DOCKET_UID:-10001}:${DOCKET_GID:-10001}"
    command:
      - sh
      - -c
      - >-
        ./.venv/bin/alembic upgrade head &&
        ./.venv/bin/docket-provision-ingress-role &&
        exec ./.venv/bin/uvicorn docket.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: ${DOCKET_SERVICE_ENV_FILE:-.env}
        required: false
    environment:
      DOCKET_DATABASE_URL: ${DOCKET_DATABASE_URL:-postgresql+psycopg://docket:docket-smoke@postgres:5432/docket}
      DOCKET_TO_HERMES_TOKEN_FILE: /run/docket-secrets/docket_to_hermes_token
      DOCKET_TRIAGE_TOKEN_FILE: /run/docket-secrets/docket_triage_token
      HERMES_TO_DOCKET_TOKEN_FILE: /run/docket-secrets/hermes_to_docket_token
      DOCKET_INTERACTION_SIGNING_KEY_FILE: /run/docket-secrets/interaction_signing_key
      DOCKET_ATTACHMENT_ENCRYPTION_KEY_FILE: /run/docket-secrets/attachment_encryption_key
      DOCKET_ATTACHMENT_ENCRYPTION_KEY_REF: ${DOCKET_ATTACHMENT_ENCRYPTION_KEY_REF:-attachment-v1}
      DOCKET_ATTACHMENT_MAX_BYTES: ${DOCKET_ATTACHMENT_MAX_BYTES:-8388608}
      DOCKET_ATTACHMENT_TOTAL_MAX_BYTES: ${DOCKET_ATTACHMENT_TOTAL_MAX_BYTES:-16777216}
      DOCKET_INGRESS_DB_PASSWORD_FILE: /run/docket-secrets/discord_ingress_db_password
      GOOGLE_OAUTH_CLIENT_FILE: /run/docket-secrets/google_oauth_client.json
      GOOGLE_OAUTH_TOKEN_FILE: /run/docket-secrets/google_oauth_token.json
      DOCKET_DISCORD_PROJECTION_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DOCKET_CREDENTIALS_DIR:-./secrets/smoke}:/run/docket-secrets:ro
      - ./backups:/var/lib/docket/backups
    ports:
      - "127.0.0.1:${DOCKET_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [docket-internal]

volumes:
  postgres-data:
networks:
  docket-internal:
    internal: false
