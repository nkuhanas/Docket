persistence_and_concurrency_design:
  retained_models:
    - model: ChangeSet
      table: change_sets
      invariant: existing_unique_semantic_request_ref_enforces_one_changeset_lineage
    - model: ChangeSetRevision
      table: change_set_revisions
      invariant: immutable_revision_snapshot
    - model: SemanticRequest
      table: semantic_requests
      invariant: authority_survives_noncommitting_failures
    - model: SemanticRequestAttempt
      table: semantic_request_attempts
      invariant: one_execution_attempt_observation_and_causal_fence
  new_internal_models:
    - model: AssemblyExecution
      table: assembly_executions
      public_ref: false
      identity: [source_utterance_ref, trace_ref]
      fields:
        - semantic_request_ref
        - semantic_request_attempt_ref
        - next_sequence
        - created_at
        - updated_at
      purpose: durable_per_trace_attempt_queue_owner
    - model: AssemblyOperation
      table: assembly_operations
      public_ref: false
      identity: [source_utterance_ref, upstream_tool_call_id]
      fields:
        - assembly_execution_id
        - operation_key
        - operation_kind
        - tool_name
        - argument_hash
        - patch_hash
        - attempt_sequence
        - causal_observed_revision
        - state
        - result_disposition
        - result_json
        - created_at
        - completed_at
      states: [admitted, running, completed, rejected, unknown]
      purpose: infrastructure_idempotency_and_causal_admission
  altered_models:
    - model: SemanticRequestAttempt
      add_fields:
        - execution_trace_ref
        - observed_changeset_ref
        - observed_draft_revision
      add_constraint: unique_semantic_request_execution_trace
    - model: ChangeSet
      add_fields:
        - normalized_entries_json
        - compiled_action_ownership_json
        - compiler_manifest_json
    - model: ChangeSetRevision
      add_fields:
        - normalized_entries_json
        - compiled_action_ownership_json
        - compiler_manifest_json
        - assembly_operation_id
  lock_order:
    - intent_session
    - semantic_request
    - semantic_request_attempt
    - change_set
    - assembly_operation
  edit_fence: causal_observed_revision_must_equal_current_draft_revision
  commit_fence: attempt_observed_draft_revision_must_equal_current_draft_revision
  new_attempt_rule: existing_draft_requires_successful_current_revision_review_before_edit_or_commit
  first_patch_rule: same_transaction_creates_draft_and_revision_and_establishes_observation
  automatic_merge: false
  process_local_mutex_sufficient: false
  restart_behavior: admitted_or_running_operations_reconcile_from_revision_and_receipt_rows
  named_postgresql_race_fixtures:
    - postgres_cross_attempt_stale_stage
    - postgres_cross_attempt_stale_commit
    - postgres_same_attempt_concurrent_stage
    - postgres_review_then_commit_order
    - postgres_first_patch_unique_draft

typed_stage_schema:
  tool_input: StageChangesInput
  common_fields:
    - utterance_ref
    - request_key
    - assembly_scope
    - patch
  infrastructure_only_field: assembly_operation_token
  infrastructure_field_removed_from_model_schema: true
  assembly_scope:
    model: AssemblyAuthorityScopeInput
    fields:
      - resolved_intent
      - allowed_mutation_types
      - target_refs
      - source_refs
      - planned_create_types
      - explicit_exclusions
    first_stage_required: true
    later_stage_behavior: may_be_omitted_or_must_match_persisted_scope_exactly
    hash_role: semantic_request_authority_scope_hash
  patch:
    max_operations_per_call: 50
    discriminator: operation
    variants:
      - action_upsert
      - action_remove
      - normalized_entry_upsert
      - normalized_entry_remove
  action_upsert:
    payload: existing_discriminated_canonical_mutation_union
    progressive_filter: mutation_types
  normalized_entry_upsert:
    discriminator: entry_type
    variants:
      - tracked_temporal_entry
      - scheduled_occurrence_entry
      - schedule_exception_entry
    progressive_filter: normalized_entry_types
  reference_closure:
    persistent_object: typed_public_ref
    same_changeset_object: stable_change_id
    evidence: source_ref_plus_fragment_locator_and_hash

compiler_boundary_matrix:
  compiler_identifier: docket.normalized-temporal-entry
  compiler_version: 1
  deterministic_identifiers:
    item: "{import_entry_id}.item"
    temporal_binding: "{import_entry_id}.time"
    event: "{import_entry_id}.event"
    provider_operation: "{import_entry_id}.provider"
  mechanical_derivations:
    - normalized_item_fields_to_item_create
    - normalized_temporal_fields_to_temporal_binding_create
    - explicit_scheduled_occurrence_to_canonical_event_create
    - exact_event_links_to_item_and_temporal_change_ids
    - compiler_owned_provider_intent_from_explicit_projection_and_lane_binding
    - deterministic_basis_completion_from_entry_statement
  semantic_inputs_required:
    - exact_source_fragment_locator_and_hash
    - title_and_descriptive_kind
    - resolved_context_or_authorized_planned_context_create
    - temporal_role_precision_value_and_timezone
    - occurrence_versus_schedule_exception_disposition
    - explicit_calendar_projection_intent
    - resolved_lane_and_account_binding_when_projected
    - replacement_or_supersession_scope
  prohibited_inference:
    - missing_date_time_duration_timezone_or_location
    - uncertain_context_entity_or_course
    - uncertain_lane_or_provider_account
    - event_from_date_alone
    - ordinary_event_from_no_class_or_closure
    - source_replacement_scope
    - authority_broadening
  evidence_materialization:
    behavior: create_immutable_interpreted_statement_when_entry_is_first_staged
    replacement: create_new_statement_and_retain_prior_evidence
    removal: retain_statement_evidence_but_remove_current_entry_and_derived_actions
  ownership:
    direct_compiler_owned_action_edit: rejected_compiler_owned_action
    entry_replacement: atomically_replace_complete_owned_action_set
    entry_removal: remove_complete_owned_action_set
    orphaned_dependency_edges: remove_when_unreferenced_and_compiler_owned
    compiler_upgrade: explicit_recompile_stage_operation_only

idempotency_and_ingress_design:
  admission_endpoint: /internal/v1/discord/assembly-operations/admit
  caller: docket_discord_plugin_only
  request_contains:
    - authenticated_discord_context
    - utterance_ref
    - trace_ref
    - upstream_tool_call_id
    - trace_ordinal
    - tool_name
    - canonical_model_argument_hash
  request_excludes:
    - raw_stage_patch
    - source_text
    - authorization_headers
  response:
    - opaque_assembly_operation_token
  plugin_behavior:
    - validate_model_arguments_before_admission
    - persist_admission_before_mcp_delivery
    - inject_token_after_model_validation
    - strip_infrastructure_field_from_model_facing_schema
    - recover_same_token_for_same_utterance_and_upstream_call
  mismatch_disposition: stage_idempotency_mismatch
  replay_behavior: return_original_terminal_result_without_reapplying_or_advancing_observation
  unknown_behavior: reconcile_revision_and_receipt_before_application
  commit_idempotency: semantic_request_ref_to_single_committed_changeset_and_receipt
  named_fixtures:
    - lost_stage_response_replay
    - old_stage_retry_after_newer_replacement
    - old_remove_retry_after_restore
    - operation_key_content_mismatch
    - admitted_operation_restart_reconciliation
    - lost_commit_response_receipt_replay
    - unknown_commit_outcome_reconciliation

output_and_workload_contract:
  output_budgets:
    ordinary_serialized_json_bytes: 16384
    audit_serialized_json_bytes: 65536
    review_default_items: 25
    review_max_items: 100
  stage_receipt:
    includes:
      - disposition
      - changeset_ref
      - current_revision
      - staged_removed_replayed_counts
      - whole_draft_effect_totals
      - assembly_readiness
      - bounded_diagnostic_counts_and_sample
      - next_action
    excludes:
      - complete_draft
      - repeated_source_text
      - complete_schema
      - complete_provenance_chain
  review_cursor:
    binds:
      - changeset_ref
      - immutable_revision
      - view
      - filters
      - ordering
      - next_position
    old_snapshot_does_not_observe_new_revision: true
    unavailable_snapshot_disposition: review_snapshot_unavailable
  commit_receipt:
    durable_before_rendering: true
    fields:
      - changeset_ref
      - semantic_request_ref
      - canonical_disposition
      - canonical_effect_counts
      - provider_operation_counts_by_initial_state
      - affected_ref_sample
      - detail_cursor
    provider_truth: queued_is_not_provider_applied
  workload_limits:
    normalized_stage_request_bytes: 524288
    patch_operations_per_call: 50
    normalized_entries_per_call: 25
    normalized_entries_per_draft: 250
    draft_revisions: 1000
    canonical_actions_per_draft: 1000
    provider_operations_per_draft: 500
    dependency_depth: 32
  limit_disposition: workload_limit_exceeded
  limit_response_requires:
    - measured_count
    - applicable_limit
    - deterministic_partition_or_narrowing_strategy
    - preserved_authority_disposition

