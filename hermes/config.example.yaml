# Hermes Agent v2026.7.20 / source commit c7d08de287556b3d339df336b180a39d4980ebd7
# Replace every Discord ID before enabling the gateway.

display:
  tool_progress: log
  interim_assistant_messages: false
  show_commentary: false
  background_process_notifications: off

# Generic Hermes cron delivery is intentionally unavailable in Docket Discord
# channels. Docket owns durable reminders and routes them through daily threads.
platform_toolsets:
  discord:
    - image_gen
    - memory
    - session_search
    - skills
    - todo
    - tts
    - vision

discord:
  require_mention: true
  thread_require_mention: false
  free_response_channels:
    - "000000000000000003" # docket-chat
    - "000000000000000004" # queue root is control-only; child threads admit the operator
  allowed_channels:
    - "000000000000000003" # docket-chat
    - "000000000000000004" # docket-queue
    - "000000000000000005" # docket-system
  no_thread_channels:
    - "000000000000000003" # reply in place
    - "000000000000000004" # do not create a nested response thread
  ignored_channels: []
  history_backfill: false
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true

group_sessions_per_user: true

plugins:
  enabled:
    - docket-discord

mcp_servers:
  docket:
    url: "http://docket:8000/mcp/"
    headers:
      Authorization: "Bearer ${DOCKET_MCP_TOKEN}"
    timeout: 30
    connect_timeout: 15
    supports_parallel_tool_calls: false
    sampling:
      enabled: false
    tools:
      include:
        - docket_get_record
        - docket_search_records
        - docket_list_accounts
        - docket_list_calendar_lanes
        - docket_list_calendar_events
        - docket_get_calendar_sync_status
        - docket_get_calendar_profile
        - docket_list_reminder_rules
        - docket_list_queue_items
        - docket_get_queue_item
        - docket_get_triage_case
        - docket_search_history
        - docket_get_history_entry
        - docket_get_conflict
        - docket_get_intent_session
        - docket_get_network_neighborhood
        - docket_get_organization_context
        - docket_get_person_context
        - docket_network_search
        - docket_query_people
        - docket_commit_changeset
        - docket_resolve_conflict
      prompts: false
      resources: false
