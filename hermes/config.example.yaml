# Hermes Agent v2026.7.20 / source commit c7d08de287556b3d339df336b180a39d4980ebd7
# Replace every Discord ID before enabling the gateway.

display:
  tool_progress: log
  interim_assistant_messages: false
  show_commentary: false
  background_process_notifications: off

# Generic Hermes cron delivery is intentionally unavailable in Docket Discord
# channels. Docket owns durable reminders and routes them through daily threads.
platform_toolsets:
  discord:
    - image_gen
    - memory
    - session_search
    - skills
    - todo
    - tts
    - vision

discord:
  require_mention: true
  thread_require_mention: false
  free_response_channels:
    - "000000000000000003" # docket-chat
    - "000000000000000004" # queue root is control-only; child threads admit the operator
  allowed_channels:
    - "000000000000000003" # docket-chat
    - "000000000000000004" # docket-queue
    - "000000000000000005" # docket-system
  no_thread_channels:
    - "000000000000000003" # reply in place
    - "000000000000000004" # do not create a nested response thread
  ignored_channels: []
  history_backfill: false
  allow_mentions:
    everyone: false
    roles: false
    users: true
    replied_user: true

group_sessions_per_user: true

# Docket owns durable conversational/intent continuity. Hermes should retain a
# useful short conversational window, but must not accumulate one immortal
# per-operator transcript until the next request blocks on multi-minute
# compression.
session_reset:
  mode: both
  at_hour: 4
  idle_minutes: 120
  notify: false

# Compress well before the provider's hard context cliff and use the cheaper,
# faster Codex auxiliary model. Session reset is the primary bound; compression
# remains a fallback for unusually busy two-hour windows.
compression:
  threshold: 0.50
  target_ratio: 0.15
  protect_last_n: 12
  protect_first_n: 0
  codex_gpt55_autoraise: false

# Docket's exact discriminated mutation schemas are intentionally large. Hermes
# progressive disclosure keeps them out of ordinary read/planning turns while
# preserving the exact schema, scope gate, and plugin hooks when invoked.
tools:
  tool_search:
    enabled: "on"
    search_default_limit: 8
    max_search_limit: 20

auxiliary:
  compression:
    provider: codex
    model: gpt-5.6-luna
    timeout: 120
    reasoning_effort: low

plugins:
  enabled:
    - docket-discord

mcp_servers:
  docket:
    url: "http://docket:8000/mcp/"
    headers:
      Authorization: "Bearer ${DOCKET_MCP_TOKEN}"
    timeout: 30
    connect_timeout: 15
    supports_parallel_tool_calls: false
    sampling:
      enabled: false
    tools:
      include:
        - docket_commit_changeset
        - docket_get_attention_case
        - docket_get_calendar_sync_status
        - docket_get_conflict
        - docket_get_context_neighborhood
        - docket_get_history_entry
        - docket_get_intent_session
        - docket_get_item_context
        - docket_get_organization_or_institution_context
        - docket_get_person_context
        - docket_list_calendar_lanes
        - docket_list_provider_accounts
        - docket_list_provider_calendar_events
        - docket_list_reminder_plans
        - docket_query_items
        - docket_query_people
        - docket_read_attachment_text
        - docket_resolve_conflict
        - docket_search_entities
        - docket_search_history
      prompts: false
      resources: false
